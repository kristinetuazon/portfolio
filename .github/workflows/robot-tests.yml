name: Robot tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  robot:
    name: Robot Framework (Browser library)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install and build the site
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: portfolio/tests/robot/requirements.txt

      - name: Install Robot Framework and the Browser library
        run: |
          pip install -r tests/robot/requirements.txt
          rfbrowser init chromium

      - name: Start the site
        run: |
          npm start -- -p 3000 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 > /dev/null && exit 0; sleep 1; done
          echo "Site did not start" && exit 1

      - name: Run the Robot tests
        run: robot --outputdir tests/robot/results tests/robot

      - name: Keep the Robot report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: portfolio/tests/robot/results
          retention-days: 14
